services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/ivankiryukhin19/film-react-nest/backend:latest
    container_name: backend
    env_file:
      - backend/.env
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/ivankiryukhin19/film-react-nest/frontend:latest
    container_name: frontend
    networks:
      - app-network
    volumes:
      - frontend-dist:/app/dist
    env_file:
      - frontend/.env

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ghcr.io/ivankiryukhin19/film-react-nest/nginx:latest
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:13.22-alpine3.22
    container_name: postgres
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file: .env
    ports:
      - 8080:80
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/root/.pgadmin
    networks:
      - app-network
    restart: unless-stopped

volumes:
  frontend-dist:
  postgres-data:
  pgadmin-data:

networks:
  app-network:
    driver: bridge
